name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libffi-dev zlib1g-dev libsm6 libxext6 libxrender-dev ccache git python3-dev python3-pip openjdk-17-jdk zip unzip autoconf libtool pkg-config libncurses5-dev libncursesw5-dev libtinfo5 cmake gettext

    - name: Prepare Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Install Buildozer & Cython Fix
      run: |
        pip install --upgrade pip setuptools
        pip install "cython==0.29.33"
        pip install buildozer

    - name: Build APK
      run: |
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sonmez-audio-apk
        path: bin/*.apk
