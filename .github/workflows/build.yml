name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Force System Python 3.10
      run: |
        sudo rm -f /usr/bin/python3
        sudo ln -s /opt/hostedtoolcache/Python/3.10.*/x64/bin/python3 /usr/bin/python3
        python3 --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libffi-dev zlib1g-dev libsm6 libxext6 libxrender-dev ccache git python3-dev python3-pip openjdk-17-jdk zip unzip autoconf libtool pkg-config libncurses5-dev libncursesw5-dev libtinfo5 cmake gettext

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip setuptools
        python3 -m pip install "cython==0.29.33"
        python3 -m pip install "buildozer==1.5.0"

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonmez-audio-apk
        path: bin/*.apk
